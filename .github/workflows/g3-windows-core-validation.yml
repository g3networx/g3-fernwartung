name: g3 Windows Core package validation
on:
  workflow_dispatch:
    inputs:
      asset_id:
        type: string
        required: true
      sha256:
        type: string
        required: true
permissions:
  # GitHub exposes draft release assets only to push-capable identities. The
  # short-lived job token is used only for this pinned private candidate fetch.
  contents: write
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Fetch exact draft candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.asset_id }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          if($env:ASSET -notmatch '^\d+$' -or $env:SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Invalid candidate'}
          Invoke-WebRequest ('https://api.github.com/repos/'+$env:GITHUB_REPOSITORY+'/releases/assets/'+$env:ASSET) -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28'} -OutFile candidate.zip
          if((Get-FileHash candidate.zip).Hash.ToLowerInvariant() -ne $env:SHA256){throw 'Candidate archive digest mismatch'}
          Expand-Archive candidate.zip candidate
      - name: Clean install, native lease, repair and removal
        shell: pwsh
        run: ./g3-build/test-windows-core.ps1 -PackageDirectory (Resolve-Path candidate)
      - name: Collect installer logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          if(Test-Path candidate/core-installation-acceptance.json){Copy-Item candidate/core-installation-acceptance.json evidence/}
          Get-ChildItem C:/ProgramData/g3-NetworX-Setup-g3Host-1.5.0-g3.22-core.1 -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -in '.log','.txt'} | Copy-Item -Destination evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g3-core-installation-evidence
          path: evidence/
          if-no-files-found: warn
