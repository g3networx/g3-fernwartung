name: g3.50.1 bootstrap r1 known-native upgrade compatibility
on:
  push:
    branches: [g3-ha-commander-20261102]
    paths: [.github/workflows/g3-ha-bootstrap-r1.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bootstrap:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Reuse exact accepted MSI and payload
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $changed=@(git diff --name-only 9af8ef58a9b6087c6b6c9e46670459ecd95613af HEAD -- src libs Cargo.toml Cargo.lock flutter/lib flutter/windows)
          if($changed.Count){throw 'Runtime source changed; native/UI reuse forbidden'}
          $zip=Join-Path $env:RUNNER_TEMP 'candidate.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/13126006715/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $zip
          if((Get-FileHash $zip).Hash.ToLowerInvariant() -ne 'ad7f291b3ba86b90a24866eb0d176c704805d8d5401767deadf6ff27b96e595c'){throw 'Candidate pin mismatch'}
          Expand-Archive $zip outputs
          ./g3-build/build-ha-bootstrap-r1.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3501-bootstrap-r1-${{ github.sha }}
          path: |
            outputs/*-r1.exe
            outputs/bootstrap-r1-hashes.json
            outputs/process-inspection-acceptance.json
            outputs/setup-progress-acceptance.json
          retention-days: 30
  acceptance:
    needs: bootstrap
    strategy:
      fail-fast: false
      matrix:
        scenario: [g332-full, g3402-host, fresh, existing-host]
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with: {toolchain: 1.75.0}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: g3501-bootstrap-r1-${{ github.sha }}
          path: r1
      - name: Prepare exact packages and native session fixture
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'candidate.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/13126006715/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $zip
          if((Get-FileHash $zip).Hash.ToLowerInvariant() -ne 'ad7f291b3ba86b90a24866eb0d176c704805d8d5401767deadf6ff27b96e595c'){throw 'Candidate pin mismatch'}
          Expand-Archive $zip outputs
          $metadata=Get-Content r1/bootstrap-r1-hashes.json -Raw|ConvertFrom-Json
          foreach($kind in @('windows','host')){
            $item=$metadata.items.$kind;$file=Join-Path r1 $item.file
            if((Get-FileHash $file).Hash.ToLowerInvariant() -ne $item.sha256){throw 'r1 pin mismatch'}
            Copy-Item -LiteralPath $file -Destination (Join-Path outputs ($item.file.Replace('-r1.exe','.exe'))) -Force
          }
          $python=(Get-Command python).Source
          & $python -c 'import tomllib'
          if($LASTEXITCODE -ne 0){$v=@(Get-ChildItem (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Directory|Where-Object {$_.Name -match '^3\.(11|12|13|14)\.'}|Sort-Object Name -Descending);if(!$v.Count){throw 'Python TOML parser required'};$python=Join-Path $v[0].FullName 'x64/python.exe'}
          "G3_PROFILE_PYTHON=$python"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          python g3-build/test-update-session-gate.py
          if($LASTEXITCODE -ne 0){throw 'Native session fixture failed'}
      - name: Upgrade known native versions without bypassing sessions
        if: matrix.scenario == 'g332-full' || matrix.scenario == 'g3402-host'
        shell: pwsh
        run: ./g3-build/test-ha-known-native-upgrade.ps1 -Scenario '${{ matrix.scenario }}'
      - name: Paired fresh and existing Host acceptance
        if: matrix.scenario == 'fresh' || matrix.scenario == 'existing-host'
        shell: pwsh
        env:
          G3_BUILD_VERSION: 1.5.0-g3.50.1
          G3_PAIR_SCENARIO: ${{ matrix.scenario }}
        run: |
          ./g3-build/test-shared-device-install.ps1
          ./g3-build/test-ha-window-branding.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g3501-bootstrap-r1-acceptance-${{ matrix.scenario }}-${{ github.sha }}
          path: outputs/*acceptance.json
          retention-days: 30
