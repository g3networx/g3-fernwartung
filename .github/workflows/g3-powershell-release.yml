name: g3.40.1 verified same-version bootstrap repair
on:
  push:
    branches: [g3-remote-powershell-20261031]
    paths: [.github/workflows/g3-powershell-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
      - name: Fetch exact accepted current and prior candidate packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $accepted=Join-Path $env:RUNNER_TEMP 'accepted-g3401.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/13058545110/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $accepted
          if((Get-FileHash $accepted).Hash.ToLowerInvariant() -ne 'c38db1b31ddf02b24abad88efb15a18809803c4623f696d949611ab0d8053a36'){throw 'Accepted artifact pin mismatch'}
          "G3_POWERSHELL_ACCEPTED_ARCHIVE=$accepted"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $prior=Join-Path $env:RUNNER_TEMP 'prior-g3401.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/13057592533/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $prior
          if((Get-FileHash $prior).Hash.ToLowerInvariant() -ne '395e771abde1ad62ec74f64c4c6cfe806e8a359b1e822fd7b428d28cd1941080'){throw 'Prior artifact pin mismatch'}
          "G3_PRIOR_POWERSHELL_ARCHIVE=$prior"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rebuild only wrappers and verify different-package same-version repair
        shell: pwsh
        run: |
          python g3-build/rebuild-powershell-bootstrap.py
          if($LASTEXITCODE -ne 0){throw 'Bootstrap build failed'}
          python g3-build/test-process-inspection.py
          if($LASTEXITCODE -ne 0){throw 'Process inspection regression failed'}
          python g3-build/test-setup-progress.py
          if($LASTEXITCODE -ne 0){throw 'Setup progress regression failed'}
          python g3-build/test-update-session-gate.py
          if($LASTEXITCODE -ne 0){throw 'Session gate regression failed'}
          ./g3-build/test-small-update.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g3401-release-${{ github.sha }}
          path: outputs/*
          retention-days: 30
  paired-acceptance:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing-host]
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: g3401-release-${{ github.sha }}
          path: outputs
      - name: Verify native session gates and paired installations on disposable runner
        shell: pwsh
        env:
          G3_BUILD_VERSION: 1.5.0-g3.40.1
          G3_PAIR_SCENARIO: ${{ matrix.scenario }}
        run: |
          python g3-build/test-update-session-gate.py
          if($LASTEXITCODE -ne 0){throw 'Session regression failed'}
          ./g3-build/test-shared-device-install.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g3401-pair-${{ matrix.scenario }}-${{ github.sha }}
          path: outputs/*acceptance.json
          retention-days: 30
