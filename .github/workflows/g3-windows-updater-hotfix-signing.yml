name: Sign OpsLinX Windows update launchers 1.62.20053
on:
  push:
    branches: [g3-codesigning-setup]
    paths: [.github/workflows/g3-windows-updater-hotfix-signing.yml]
permissions:
  contents: read
  actions: read
env:
  SOURCE_COMMIT: b41a54f5ffe23a160695c2877ee91222fa49b499
  PACKAGE_SOURCE: d1efa49aea9f177110d139827a3c9b0bd73b79eb
  RELEASE_VERSION: 1.5.0-g3.62.20053
jobs:
  signing:
    if: github.repository == 'g3networx/g3-fernwartung' && github.ref == 'refs/heads/g3-codesigning-setup'
    runs-on: windows-2022
    timeout-minutes: 35
    environment: signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13898024239
          run-id: 43108539236
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opslinx-build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 13899047692
          run-id: 43116929807
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/opslinx-signed
      - name: Test running and exited process detection
        shell: pwsh
        run: ./g3-build/test-bootstrap-process-exit.ps1
      - name: Sign and verify Windows packages
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.OPSLINX_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.OPSLINX_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = $env:SOURCE_COMMIT
          if ((git rev-parse HEAD) -ne $sourceCommit) { throw 'Signing source mismatch.' }
          $env:GITHUB_SHA = $sourceCommit
          $thumbprint = '2B29AA03DE164FFF1081D924A2BF4F73BBE63453'
          $pfx = Join-Path $env:RUNNER_TEMP 'opslinx-signing.pfx'
          try {
            if (!$env:SIGNING_PFX_BASE64 -or !$env:SIGNING_PFX_PASSWORD) {
              throw 'Signing environment secrets are missing.'
            }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            Write-Host 'Importing the signing certificate.'
            $null = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $signer = Get-Item "Cert:\CurrentUser\My\$thumbprint"
            if (!$signer.HasPrivateKey) { throw 'OpsLinX private key is missing.' }

            $root = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-root-ca.cer').Path)
            $issuer = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-device-ca.cer').Path)
            if ($root.Thumbprint -ne '4F7BCA98FEE3E8CC68B38E5A3DA35C5B81C63542' -or $issuer.Thumbprint -ne '8F07DD7BC81F34B95D73BB0E06589CD6D4BA53DE') {
              throw 'Unexpected public CA certificates.'
            }
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.TrustMode = 'CustomRootTrust'
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            $chain.ChainPolicy.DisableCertificateDownloads = $true
            $null = $chain.ChainPolicy.CustomTrustStore.Add($root)
            $null = $chain.ChainPolicy.ExtraStore.Add($issuer)
            $null = $chain.ChainPolicy.ApplicationPolicy.Add([Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            if (!$chain.Build($signer) -or $chain.ChainElements.Count -ne 3) {
              throw 'OpsLinX signing certificate does not chain to the configured root.'
            }

            Write-Host 'Custom CA chain verified. Installing public CA certificates on the hosted test runner.'
            & certutil.exe -f -addstore Root g3-build/codesigning/g3-root-ca.cer
            if ($LASTEXITCODE -ne 0) { throw 'Test root import failed.' }
            $null = Import-Certificate -FilePath 'g3-build/codesigning/g3-device-ca.cer' -CertStoreLocation Cert:\CurrentUser\CA
            & ./g3-build/sign-opslinx-launcher-hotfix.ps1 -BuildOutput (Join-Path $env:RUNNER_TEMP 'opslinx-build') -SignedOutput (Join-Path $env:RUNNER_TEMP 'opslinx-signed') -ReleaseVersion $env:RELEASE_VERSION -PackageSource $env:PACKAGE_SOURCE
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
            if (Test-Path "Cert:\CurrentUser\My\$thumbprint") { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-windows-launcher-hotfix-${{ github.sha }}
          path: |
            outputs/g3-OpsLinX-*-update-install.exe
            outputs/g3-OpsLinX-*-update-install.exe.p7s
            outputs/opslinx-launcher-signatures.json
          if-no-files-found: error
          retention-days: 7

  verify-signatures:
    needs: signing
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opslinx-windows-launcher-hotfix-${{ github.sha }}
          path: signed
      - name: Verify both signed launchers on Windows without the g3 CA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $caIds = @('4F7BCA98FEE3E8CC68B38E5A3DA35C5B81C63542','8F07DD7BC81F34B95D73BB0E06589CD6D4BA53DE')
          if (Get-ChildItem Cert:\LocalMachine\Root,Cert:\CurrentUser\Root,Cert:\LocalMachine\CA,Cert:\CurrentUser\CA | Where-Object Thumbprint -in $caIds) {
            throw 'The clean verification runner already trusts the g3 CA.'
          }
          $verify = Join-Path $env:RUNNER_TEMP 'verify-opslinx-package.exe'
          & 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe' /nologo /target:exe /reference:System.Security.dll "/out:$verify" '/resource:g3-build\codesigning\g3-root-ca.cer,g3.signing.root' '/resource:g3-build\codesigning\g3-device-ca.cer,g3.signing.issuer' 'g3-build\codesigning\OpsLinXPackageSignature.cs' 'g3-build\codesigning\VerifyOpsLinXPackage.cs'
          if ($LASTEXITCODE) { throw 'Verifier compilation failed.' }
          $packages = Get-ChildItem signed -File | Where-Object Extension -eq '.exe'
          if ($packages.Count -ne 2) { throw 'Unexpected signed package count.' }
          foreach ($file in $packages) {
            & $verify $file.FullName $file.Name ($file.FullName + '.p7s')
            if ($LASTEXITCODE) { throw "Built-in CA verification failed for $($file.Name)." }
          }
          $test = $packages[0]
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-package.bin'
          Copy-Item -LiteralPath $test.FullName -Destination $tampered
          $stream = [IO.File]::OpenWrite($tampered)
          try { $stream.WriteByte(0) } finally { $stream.Dispose() }
          & $verify $tampered $test.Name ($test.FullName + '.p7s')
          if (!$LASTEXITCODE) { throw 'Tampered package accepted.' }
          & $verify $test.FullName 'wrong-package.exe' ($test.FullName + '.p7s')
          if (!$LASTEXITCODE) { throw 'Wrong package name accepted.' }
          Write-Host 'Both launchers verified with the built-in CA. Changed bytes and wrong package name rejected.'
          exit 0
