name: Sign OpsLinX Android 1.5.3 build 20064
on:
  push:
    branches: [g3-codesigning-setup]
    paths: [.github/workflows/g3-android-lab-signing.yml]
permissions:
  actions: read
env:
  BUILD_RUN: '43596263278'
  APK_SHA256: 9c9a9c39927ab6e603af74569c13b436685607f5899d6b505d34cf779f9594de
jobs:
  stage-apk:
    if: github.repository == 'g3networx/g3-fernwartung' && github.ref == 'refs/heads/g3-codesigning-setup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify the pinned Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" | jq -e '.conclusion == "success" and .head_branch == "g3-rustdesk-1.5.3-android-lab" and .head_sha == "819f9ad3ffd9bae129f865ea610e1c60070928bd"' >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14114969547'
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify the APK digest
        run: echo "$APK_SHA256  app-arm64-v8a-release.apk" | sha256sum -c
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-android-20064-signing-input
          path: app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 1

  signing:
    if: github.repository == 'g3networx/g3-fernwartung' && github.ref == 'refs/heads/g3-codesigning-setup'
    needs: stage-apk
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opslinx-android-20064-signing-input
          path: unsigned
      - name: Check APK identity, sign and verify
        shell: bash
        env:
          OPSLINX_ANDROID_SIGNING: ${{ secrets.OPSLINX_ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -f "$work/key.p12" "$work/password" "$work/verification"; rmdir "$work"' EXIT
          sdk=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$sdk" || { echo 'Android APK signing tools are unavailable.'; exit 1; }
          src=unsigned/app-arm64-v8a-release.apk
          echo "$APK_SHA256  $src" | sha256sum -c
          badging=$("${sdk%/*}/aapt" dump badging "$src")
          # Flutter 3.24 adds 2000 to versionCode for the ARM64 split.
          grep -q "^package: name='net.g3nx.opslinx.lab' versionCode='22064' versionName='3.6.2'" <<< "$badging" \
            || { echo 'Unexpected APK identity.'; grep '^package:' <<< "$badging"; exit 1; }
          grep -Eq "^application(-label:|: label=)'g3 OpsLinX'( |$)" <<< "$badging" \
            || { echo 'Unexpected APK display name.'; exit 1; }
          python - "$work" <<'PY'
          import base64, json, os, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          secret = json.loads(os.environ.pop('OPSLINX_ANDROID_SIGNING'))
          (directory / 'key.p12').write_bytes(base64.b64decode(secret['pkcs12'], validate=True))
          (directory / 'password').write_text((secret['password'] + '\n') * 2)
          PY
          unset OPSLINX_ANDROID_SIGNING
          mkdir signed
          apk=signed/g3-OpsLinX-Android-1.5.3-g3.62.20064-arm64.apk
          "$sdk" sign --ks "$work/key.p12" --ks-type PKCS12 --ks-key-alias opslinx-android \
            --ks-pass "file:$work/password" --key-pass "file:$work/password" --out "$apk" "$src"
          "$sdk" verify --verbose --print-certs "$apk" | tee "$work/verification"
          expected=3c69fa623753dc13a8ab41bf0cdbe56f018eea2d8f0a961cb8667e91b8fcc6ee
          grep -Fxq 'Number of signers: 1' "$work/verification" || { echo 'Unexpected number of APK signers.'; exit 1; }
          grep -Fxq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/verification"
          grep -Eixq "(Signer #1|V[0-9]+\.[0-9]+ Signer:?) certificate SHA-256 digest: $expected" "$work/verification" \
            || { echo 'APK signing certificate does not match the approved fingerprint.'; exit 1; }
          python - "$apk" "$expected" <<'PY'
          import hashlib, json, pathlib, sys
          apk = pathlib.Path(sys.argv[1])
          item = {'version': '1.5.3-g3.62.20064', 'version_code': 22064, 'file': apk.name,
                  'size': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
                  'signer_sha256': sys.argv[2]}
          (apk.parent / 'android-release.json').write_text(json.dumps(item, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-android-lab-arm64-signed
          path: signed/*
          if-no-files-found: error
          retention-days: 14
