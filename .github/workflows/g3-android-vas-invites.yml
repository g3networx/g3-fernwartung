name: OpsLinX Android 20100 VAS invitations
on:
  push:
    branches: [g3-opslinx-tls-registration-lab]
    paths:
      - .github/workflows/g3-android-vas-invites.yml
      - Cargo.toml
      - g3-build/hbb-common.patch
      - src/rendezvous_mediator.rs
      - src/flutter_ffi.rs
      - flutter/lib/g3_vas_inbox.dart
      - flutter/lib/mobile/pages/home_page.dart
      - flutter/lib/mobile/pages/opstalx_lab_page.dart
      - flutter/android/app/src/main/AndroidManifest.xml
      - flutter/test/g3_vas_inbox_test.dart
  workflow_dispatch:
concurrency:
  group: android-vas-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  RUST_VERSION: '1.75'
  CARGO_NDK_VERSION: '3.1.2'
  ANDROID_FLUTTER_VERSION: '3.24.5'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  NDK_VERSION: 'r28c'
jobs:
  android:
    name: Build OpsLinX Android ARM64 20100
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install missing Android build dependencies
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?The runner needs JDK 17}"
          "$JAVA_HOME/bin/java" -version
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          missing=()
          for command in autoconf automake bison clang cmake curl flex gperf libtoolize nasm ninja pkg-config unzip zip; do
            if ! command -v "$command" >/dev/null; then
              case "$command" in
                ninja) missing+=(ninja-build) ;;
                libtoolize) missing+=(libtool) ;;
                *) missing+=("$command") ;;
              esac
            fi
          done
          if ! ldconfig -p | grep -E 'libclang(-[0-9]+)?\.so' >/dev/null; then
            missing+=(libclang1)
          fi
          if (( ${#missing[@]} )); then
            apt_options=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure OpsLinX test app
        run: |
          git -C libs/hbb_common apply "$GITHUB_WORKSPACE/g3-build/hbb-common.patch"
          python3 g3-build/configure-android-lab.py

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Verify VAS Flutter code before native compilation
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/g3_vas_inbox.dart lib/mobile/pages/home_page.dart lib/mobile/pages/opstalx_lab_page.dart
          flutter test test/g3_vas_inbox_test.dart

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          ANDROID_TARGET=arm64-v8a
          if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android # TODO: drop '-android' part after caches are invalidated
          key: aarch64-linux-android

      - name: Build rustdesk lib
        env:
          G3_OPSLINX_ANDROID: '1'
          OPSLINX_TLS_REGISTRATION: '1'
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          android_sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android21 --sysroot=$android_sysroot"
          cargo ndk --platform 21 --target aarch64-linux-android build --locked --release --features flutter,hwcodec,opslinx-tls-registration
          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build test APK
        working-directory: flutter
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8/' android/gradle.properties
          echo 'org.gradle.workers.max=2' >> android/gradle.properties
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          flutter test test/image_painter_test.dart test/g3_android_update_transport_test.dart
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --build-name=3.6.2 --build-number=20100 --dart-define=G3_ANDROID_CLIENT=true \
            --dart-define=G3_OPSTALX=true \
            --dart-define=G3_CLIENT_VERSION=1.5.3-g3.62.20100 \
            '--dart-define=G3_CLIENT_DISPLAY_VERSION=g3.6.2 Build 20100'
          python - <<'PY'
          from zipfile import ZipFile

          with ZipFile('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk') as apk:
              required = {'AndroidManifest.xml', 'classes.dex', 'lib/arm64-v8a/librustdesk.so'}
              missing = required.difference(apk.namelist())
              if missing:
                  raise SystemExit(f'Missing APK files: {sorted(missing)}')
          PY
          sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-android-vas-20100-arm64
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
