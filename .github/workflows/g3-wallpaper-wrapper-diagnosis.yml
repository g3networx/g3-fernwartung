name: g3 wallpaper actual-wrapper diagnosis
on:
  push:
    branches: [g3-wallpaper-next-20261030]
    paths: [.github/workflows/g3-wallpaper-wrapper-diagnosis.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wrapper-context:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        executable: [g3Host.exe, g3Fernwartung.exe]
        stderr: [inherit, pipe]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
      - name: Reuse exact compiled native candidate without rebuilding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'wallpaper-candidate.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/12978163732/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $archive
          if((Get-FileHash $archive).Hash.ToLowerInvariant() -ne 'e54064b51c03785e10524e1029868effd822af18b86f6fea7721196c1cb61156'){throw 'Candidate artifact digest mismatch'}
          $stage=Join-Path $env:RUNNER_TEMP 'wallpaper-candidate'
          Expand-Archive $archive $stage
          $provenance=Get-Content "$stage/wallpaper-build-provenance.json" -Raw|ConvertFrom-Json
          if($provenance.source_commit -ne '38fd8c45ce76a5b01b668f878380f9878dad9736'){throw 'Candidate source mismatch'}
          Expand-Archive "$stage/g3-wallpaper-native-test-payload.zip" "$stage/payload"
          "G3_WRAPPER_PAYLOAD=$stage/payload"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Diagnose actual executable context
        shell: pwsh
        env:
          G3_WALLPAPER_TEST_DISPOSABLE: YES
          G3_WRAPPER_STDERR_MODE: ${{ matrix.stderr }}
        run: |
          New-Item -ItemType Directory -Force outputs|Out-Null
          cargo build --locked --manifest-path g3-build/wallpaper-tests/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'Validation harness compile failed'}
          & g3-build/wallpaper-tests/target/debug/g3-wallpaper-validation.exe --diagnose-wrapper "$env:G3_WRAPPER_PAYLOAD/${{ matrix.executable }}" 2>&1|Tee-Object outputs/wrapper-diagnosis.txt
          if($LASTEXITCODE -ne 0){throw 'Actual wrapper context diagnosis failed'}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wrapper-${{ matrix.executable }}-${{ matrix.stderr }}-${{ github.sha }}
          path: outputs/*
