name: g3 macOS package finalization
on:
  workflow_dispatch:
    inputs:
      arch:
        type: choice
        options: [all, aarch64]
        default: all
permissions:
  contents: read
  actions: read
env:
  VERSION: 1.5.0-g3.22
jobs:
  finalize:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'aarch64' && '[{"arch":"aarch64","runner":"macos-14"}]' || '[{"arch":"x86_64","runner":"macos-15-intel"},{"arch":"aarch64","runner":"macos-14"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: '39540544030'
          name: g3-verified-macos-${{ matrix.arch }}-14c503ab638cfcfde642dd8bbfe9053b8fb1e8de
          path: input
      - name: Verify accepted input and record package provenance
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('input');r=json.loads((p/'validation.json').read_text())
          assert str(r['finalization_run'])=='39540544030' and r['finalization_commit']=='14c503ab638cfcfde642dd8bbfe9053b8fb1e8de'
          assert r['arch']==os.environ['ARCH'] and r['version']=='1.5.0-g3.22' and len(r['files'])==1
          f=r['files'][0];assert hashlib.sha256((p/f['file']).read_bytes()).hexdigest()==f['sha256']
          source=dict(version=r['version'],source_commit=r['source']['source_commit'],run_id='39540544030',platform='macos',arch=r['arch'],files=r['files'],native_origin=r['source']['native_origin'],accepted_ui_package=r)
          (p/('platform-provenance-macos-'+r['arch']+'.json')).write_text(json.dumps(source,indent=2))
          PY
      - name: Inspect native architecture and actual Swift dependencies
        run: python3 g3-build/diagnose-macos-bundle.py
      - name: Align minimum metadata, resign integrity and repeat native startup checks
        env:
          SOURCE_RUN: '39540544030'
        run: python3 g3-build/finalize-platform.py macos '${{ matrix.arch }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g3-verified-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            verified/*.dmg
            verified/validation.json
            verified/SHA256SUMS
            verified/*.log
          if-no-files-found: error
          retention-days: 30
