name: OpsLinX internal code signing test
on:
  push:
    branches: [g3-codesigning-setup]
    paths:
      - '.github/workflows/g3-internal-signing-test.yml'
      - 'g3-build/codesigning/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    if: github.repository == 'g3networx/g3-fernwartung' && github.ref == 'refs/heads/g3-codesigning-setup'
    runs-on: windows-2022
    timeout-minutes: 10
    environment: signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sign and verify a Windows test executable
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.OPSLINX_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.OPSLINX_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = '2B29AA03DE164FFF1081D924A2BF4F73BBE63453'
          $pfx = Join-Path $env:RUNNER_TEMP 'opslinx-signing.pfx'
          $sample = Join-Path $env:RUNNER_TEMP 'opslinx-signing-test.exe'
          try {
            if (!$env:SIGNING_PFX_BASE64 -or !$env:SIGNING_PFX_PASSWORD) {
              throw 'Signing environment secrets are missing.'
            }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            Write-Host 'Importing the signing certificate.'
            $null = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $signer = Get-Item "Cert:\CurrentUser\My\$thumbprint"
            if (!$signer.HasPrivateKey) { throw 'OpsLinX private key is missing.' }

            $root = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-root-ca.cer').Path)
            $issuer = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-device-ca.cer').Path)
            if ($root.Thumbprint -ne '4F7BCA98FEE3E8CC68B38E5A3DA35C5B81C63542' -or $issuer.Thumbprint -ne '8F07DD7BC81F34B95D73BB0E06589CD6D4BA53DE') {
              throw 'Unexpected public CA certificates.'
            }
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.TrustMode = 'CustomRootTrust'
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            $chain.ChainPolicy.DisableCertificateDownloads = $true
            $null = $chain.ChainPolicy.CustomTrustStore.Add($root)
            $null = $chain.ChainPolicy.ExtraStore.Add($issuer)
            $null = $chain.ChainPolicy.ApplicationPolicy.Add([Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            if (!$chain.Build($signer) -or $chain.ChainElements.Count -ne 3) {
              throw 'OpsLinX signing certificate does not chain to the configured root.'
            }

            Write-Host 'Custom CA chain verified. Installing public CA certificates on the hosted test runner.'
            & certutil.exe -f -addstore Root g3-build/codesigning/g3-root-ca.cer
            if ($LASTEXITCODE -ne 0) { throw 'Test root import failed.' }
            $null = Import-Certificate -FilePath 'g3-build/codesigning/g3-device-ca.cer' -CertStoreLocation Cert:\CurrentUser\CA
            $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            $source = Join-Path $env:RUNNER_TEMP 'opslinx-signing-test.cs'
            Set-Content -LiteralPath $source -Value 'class SigningTest { static void Main() {} }'
            & $compiler /nologo "/out:$sample" $source
            if ($LASTEXITCODE -ne 0) { throw 'Test executable build failed.' }
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
            if (!$signtool) { throw 'Windows SDK SignTool missing.' }
            & $signtool.FullName sign /sha1 $thumbprint /s My /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $sample
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed.' }
            $signature = Get-AuthenticodeSignature -LiteralPath $sample
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $thumbprint -or !$signature.TimeStamperCertificate) {
              throw "Authenticode verification failed: $($signature.Status)."
            }
            Write-Host "Signature and timestamp verified for $thumbprint."
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
            if (Test-Path "Cert:\CurrentUser\My\$thumbprint") { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force }
          }
