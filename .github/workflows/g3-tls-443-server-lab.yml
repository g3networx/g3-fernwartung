name: OpsLinX TLS 443 server lab
on:
  push:
    branches: [g3-opslinx-tls-registration-lab]
    paths:
      - .github/workflows/g3-tls-443-server-lab.yml
      - g3-server/tls-443/hbbs-1.1.16.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-443:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk-server
          ref: 73523b31cfd25d77dee862e6fc9f5e1fb5e485ef
          path: server-lab
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.90"
      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config python3-websocket
      - name: Compile pinned rendezvous and relay servers
        working-directory: server-lab
        run: |
          git apply --check ../g3-server/tls-443/hbbs-1.1.16.patch
          git apply ../g3-server/tls-443/hbbs-1.1.16.patch
          cargo build --locked --bin hbbs --bin hbbr
      - name: Verify device registration and relay over TLS on port 443
        working-directory: server-lab
        run: |
          sudo unshare --net sh -ec 'ip link set lo up; exec /usr/bin/python3 -u "$@"' sh +            test-tls-registration.py target/debug/hbbs 443
