name: OpsLinX TLS 443 server lab
on:
  push:
    branches: [g3-opslinx-tls-registration-lab]
    paths:
      - .github/workflows/g3-tls-443-server-lab.yml
      - g3-server/tls-443/hbbs-1.1.16.patch
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-443:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rustdesk/rustdesk-server
          ref: c3a3e0d1070e29cb28b468cf6ef5b184e65e4051
          path: server-lab
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.90"
          targets: x86_64-unknown-linux-musl
      - name: Install lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev musl-tools pkg-config python3-websocket
      - name: Compile pinned rendezvous and relay servers
        working-directory: server-lab
        run: |
          git apply --check ../g3-server/tls-443/hbbs-1.1.16.patch
          git apply ../g3-server/tls-443/hbbs-1.1.16.patch
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin hbbs --bin hbbr
          file target/x86_64-unknown-linux-musl/release/hbbs target/x86_64-unknown-linux-musl/release/hbbr
      - name: Verify device registration and relay over TLS on port 443
        working-directory: server-lab
        run: |
          sudo unshare --net sh -ec 'ip link set lo up; exec /usr/bin/python3 -u "$@"' sh test-tls-registration.py target/x86_64-unknown-linux-musl/release/hbbs 443
      - name: Record the verified server digests
        working-directory: server-lab/target/x86_64-unknown-linux-musl/release
        run: sha256sum hbbs hbbr > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-tls-443-server-linux-amd64
          path: |
            server-lab/target/x86_64-unknown-linux-musl/release/hbbs
            server-lab/target/x86_64-unknown-linux-musl/release/hbbr
            server-lab/target/x86_64-unknown-linux-musl/release/SHA256SUMS
          if-no-files-found: error
