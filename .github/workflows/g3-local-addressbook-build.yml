# Internal1.60.19994: ignore only confirmed exited processes; live/unknown states and native lease remain blocking.
# Registry authority includes daemon-confirmed GUI writes and seed-only Web enrollment.
name: g3.6.2 RustDesk 1.5.3 Windows lab packages
on:
  push:
    branches: [g3-codesigning-setup, g3-lab-systeminfo-addressbook, g3-next-client-review]
    paths: [.github/workflows/g3-local-addressbook-build.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Validate native source encoding before dependency setup
        run: |
          python g3-build/check-session-privacy-encoding.py
          python g3-build/check-local-addressbook-release.py
          python g3-build/check-windows-icons.py
          ./g3-build/test-bootstrap-process-exit.ps1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
      - name: Test authoritative registry crypto, ACL, priority and stale-write rejection
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./g3-build/test-password-postinstall-policy.ps1
          cargo test --locked --manifest-path g3-build/registry-checks/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'Authoritative registry tests failed'}
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - name: Fetch pinned accepted payload and installer tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'accepted-wallpaper.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/12983117823/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $archive
          if((Get-FileHash $archive).Hash.ToLowerInvariant() -ne 'a329b203fa8735110068172981a49bb293ec8e57077dce2a67c2ee5bbcd35df3'){throw 'Accepted payload digest mismatch'}
          "G3_WALLPAPER_ACCEPTED_ARCHIVE=$archive"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $prior=Join-Path $env:RUNNER_TEMP 'prior-g3401.zip'
          Invoke-WebRequest 'https://api.github.com/repos/g3networx/g3-fernwartung/actions/artifacts/13060744241/zip' -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile $prior
          if((Get-FileHash $prior).Hash.ToLowerInvariant() -ne 'd8376ae324be33873816024c4920dcb12a98c38d0abac48f1495cb19b3a7db9d'){throw 'Prior artifact pin mismatch'}
          "G3_PRIOR_POWERSHELL_ARCHIVE=$prior"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $tools=Join-Path $env:RUNNER_TEMP 'g3401-tools'
          New-Item -ItemType Directory $tools|Out-Null
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile "$tools/wix.zip"
          if((Get-FileHash "$tools/wix.zip").Hash.ToLowerInvariant() -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'){throw 'WiX digest mismatch'}
          Expand-Archive "$tools/wix.zip" "$tools/wix/bin"
          "WIX=$tools/wix"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare accepted native core
        shell: pwsh
        run: python g3-build/package-local-addressbook.py prepare
      - name: Compile HA native core and verify Windows account handling
        shell: pwsh
        run: ./g3-build/build-local-addressbook-core.ps1
      - name: Build g3.6.2 Flutter frontend and run focused tests
        shell: pwsh
        run: ./g3-build/build-local-addressbook-ui.ps1
      - name: Package g3.6.2 Host and FullClient and test installer regressions
        shell: pwsh
        run: |
          python g3-build/package-version.py
          if($LASTEXITCODE -ne 0){throw 'Version mapping failed'}
          python g3-build/package-local-addressbook.py package
          if($LASTEXITCODE -ne 0){throw 'Packaging failed'}
          python g3-build/test-process-inspection.py
          if($LASTEXITCODE -ne 0){throw 'Process inspection regression failed'}
          python g3-build/test-setup-progress.py
          if($LASTEXITCODE -ne 0){throw 'Setup progress regression failed'}
          python g3-build/test-update-session-gate.py
          if($LASTEXITCODE -ne 0){throw 'Session guard regression failed'}
      - name: Preserve exact runtime for portable Soforthilfe signing
        shell: pwsh
        run: Compress-Archive flutter/build/windows/x64/runner/Release/* outputs/g361-runtime-payload.zip
      - name: Verify MSI metadata, embedded runtime and variant preservation without installation
        shell: pwsh
        run: python g3-build/verify-local-addressbook-msi.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g361-release-${{ github.sha }}
          path: outputs/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native build diagnostics if packaging fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: g361-diagnostics-${{ github.sha }}
          path: |
            outputs/upn-native-candidate.zip
            outputs/windows-logon-tests.txt
          if-no-files-found: ignore
          retention-days: 7


  signing:
    needs: package
    if: github.repository == 'g3networx/g3-fernwartung' && github.ref == 'refs/heads/g3-codesigning-setup'
    runs-on: windows-2022
    timeout-minutes: 35
    environment: signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: g361-release-${{ github.sha }}
          path: ${{ runner.temp }}/opslinx-build
      - name: Prepare portable package tools
        shell: pwsh
        run: python -m pip install brotli==1.1.0
      - name: Sign and verify Windows packages
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.OPSLINX_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.OPSLINX_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = '2B29AA03DE164FFF1081D924A2BF4F73BBE63453'
          $pfx = Join-Path $env:RUNNER_TEMP 'opslinx-signing.pfx'
          try {
            if (!$env:SIGNING_PFX_BASE64 -or !$env:SIGNING_PFX_PASSWORD) {
              throw 'Signing environment secrets are missing.'
            }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            Write-Host 'Importing the signing certificate.'
            $null = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
            $signer = Get-Item "Cert:\CurrentUser\My\$thumbprint"
            if (!$signer.HasPrivateKey) { throw 'OpsLinX private key is missing.' }

            $root = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-root-ca.cer').Path)
            $issuer = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path 'g3-build/codesigning/g3-device-ca.cer').Path)
            if ($root.Thumbprint -ne '4F7BCA98FEE3E8CC68B38E5A3DA35C5B81C63542' -or $issuer.Thumbprint -ne '8F07DD7BC81F34B95D73BB0E06589CD6D4BA53DE') {
              throw 'Unexpected public CA certificates.'
            }
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.TrustMode = 'CustomRootTrust'
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            $chain.ChainPolicy.DisableCertificateDownloads = $true
            $null = $chain.ChainPolicy.CustomTrustStore.Add($root)
            $null = $chain.ChainPolicy.ExtraStore.Add($issuer)
            $null = $chain.ChainPolicy.ApplicationPolicy.Add([Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
            if (!$chain.Build($signer) -or $chain.ChainElements.Count -ne 3) {
              throw 'OpsLinX signing certificate does not chain to the configured root.'
            }

            Write-Host 'Custom CA chain verified. Installing public CA certificates on the hosted test runner.'
            & certutil.exe -f -addstore Root g3-build/codesigning/g3-root-ca.cer
            if ($LASTEXITCODE -ne 0) { throw 'Test root import failed.' }
            $null = Import-Certificate -FilePath 'g3-build/codesigning/g3-device-ca.cer' -CertStoreLocation Cert:\CurrentUser\CA
            & ./g3-build/sign-opslinx-packages.ps1 -BuildOutput (Join-Path $env:RUNNER_TEMP 'opslinx-build')
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
            if (Test-Path "Cert:\CurrentUser\My\$thumbprint") { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opslinx-signed-windows-${{ github.sha }}
          path: |
            outputs/g3-OpsLinX-*-install.exe
            outputs/g3-OpsLinX-*-install.msi
            outputs/g3-Soforthilfe-*-adhoc.exe
            outputs/*.p7s
            outputs/opslinx-signatures.json
          if-no-files-found: error
          retention-days: 7

  verify-signatures:
    needs: signing
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opslinx-signed-windows-${{ github.sha }}
          path: signed
      - name: Verify all five signed packages on Windows without the g3 CA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $caIds = @('4F7BCA98FEE3E8CC68B38E5A3DA35C5B81C63542','8F07DD7BC81F34B95D73BB0E06589CD6D4BA53DE')
          if (Get-ChildItem Cert:\LocalMachine\Root,Cert:\CurrentUser\Root,Cert:\LocalMachine\CA,Cert:\CurrentUser\CA | Where-Object Thumbprint -in $caIds) {
            throw 'The clean verification runner already trusts the g3 CA.'
          }
          $verify = Join-Path $env:RUNNER_TEMP 'verify-opslinx-package.exe'
          & 'C:/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe' /nologo /target:exe /reference:System.Security.dll "/out:$verify" '/resource:g3-build\codesigning\g3-root-ca.cer,g3.signing.root' '/resource:g3-build\codesigning\g3-device-ca.cer,g3.signing.issuer' 'g3-build\codesigning\OpsLinXPackageSignature.cs' 'g3-build\codesigning\VerifyOpsLinXPackage.cs'
          if ($LASTEXITCODE) { throw 'Verifier compilation failed.' }
          $packages = Get-ChildItem signed -File | Where-Object Extension -in '.exe','.msi'
          if ($packages.Count -ne 5) { throw 'Unexpected signed package count.' }
          foreach ($file in $packages) {
            & $verify $file.FullName $file.Name ($file.FullName + '.p7s')
            if ($LASTEXITCODE) { throw "Built-in CA verification failed for $($file.Name)." }
          }
          $test = $packages[0]
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-package.bin'
          Copy-Item -LiteralPath $test.FullName -Destination $tampered
          $stream = [IO.File]::OpenWrite($tampered)
          try { $stream.WriteByte(0) } finally { $stream.Dispose() }
          & $verify $tampered $test.Name ($test.FullName + '.p7s')
          if (!$LASTEXITCODE) { throw 'Tampered package accepted.' }
          & $verify $test.FullName 'wrong-package.exe' ($test.FullName + '.p7s')
          if (!$LASTEXITCODE) { throw 'Wrong package name accepted.' }
          Write-Host 'All five packages verified with the built-in CA. Changed bytes and wrong package name rejected.'
          exit 0
