location = /ws/register {
    # The HA guard keeps the upstream pointed at the active rendezvous server.
    include /etc/nginx/snippets/opslinx-id-upstream.conf;

    # The ingress node supplies the client address for the upstream rate limit.
    set_real_ip_from rust.g3nx.net;
    set_real_ip_from opslinx02.g3nx.net;
    set_real_ip_from opslinx03.g3nx.net;
    real_ip_header X-OpsLinX-Client-IP;
    proxy_set_header X-OpsLinX-Client-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
}
