location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /var/www/opstalx/vas/assetlinks.json;
}

location ~ "^/vas/join/([0-9]{10}|[a-f0-9]{32})$" {
    return 302 /vas/?room=$1;
}

location = /vas/invite {
    limit_req zone=opstalx_rooms burst=8 nodelay;
    client_max_body_size 512;
    proxy_pass http://127.0.0.1:8761/vas/invite;
}

location = /vas/inbox {
    limit_req zone=opstalx_vas_inbox_ip burst=60 nodelay;
    client_max_body_size 512;
    proxy_pass http://127.0.0.1:8761/vas/inbox;
}
