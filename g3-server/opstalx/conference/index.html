<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpsTalX · Video-Hilfe</title><link rel="icon" href="/opstalx/icon-192.png"><link rel="stylesheet" href="/opstalx/vas/style.css?v=3"><script src="/external_api.js" defer></script><script src="/opstalx/vas/room-v17.js" defer></script></head>
<body><header><img src="/opstalx/wordmark.png" alt="OpsTalX" width="112"><strong>OpsLinX VAS</strong><a href="https://www.opslinx.de/">www.opslinx.de</a></header><main>
<form id="join" action="/vas/"><label>Raumcode <input name="room" required maxlength="32" autocomplete="off" placeholder="123 456 7890"></label><button>Beitreten</button><a href="https://linx.g3nx.net/opstalx/vas">Im OpsLinX-Portal starten</a><p id="joinError" role="status"></p></form>
<section id="sendInvitation" hidden aria-label="Handy zur Video-Hilfe einladen">
<form id="deviceInvitation"><label>Geräte-ID des Kunden <input id="inviteDevice" maxlength="64" autocomplete="off" required></label><button id="sendInvite" type="submit">Einladung senden</button><span id="inviteStatus" role="status"></span></form>
<details><summary>Raumcode oder Link als Ersatz</summary><p id="fallbackCode"></p><button id="invite" type="button">Handy-Link kopieren</button></details>
</section>
<div id="controls" hidden><span id="status" role="status"></span><button id="cameraLight" hidden>Kameralicht einschalten</button><span id="guestCameras" hidden><button id="rearCamera" type="button">Rückkamera</button><button id="frontCamera" type="button">Frontkamera</button><span id="guestCameraStatus" role="status"></span></span><span id="lightNotice" hidden>Mit dem Beitritt erlaubst du dem Support, dein Kameralicht zu steuern, sofern dein Gerät es unterstützt.</span><button id="freeze" hidden>Standbild teilen</button><button id="resume" hidden>Standbild schließen</button></div>
<div id="surface"><div id="call"></div><section id="annotation" hidden aria-label="Gemeinsames Standbild"><div id="frame"><img id="snapshot" alt="Gemeinsames Standbild"><div id="marker" hidden><span aria-label="Pfeil">&#8598;</span><span id="caption"></span></div></div><form id="noteForm" hidden><label>Texthinweis <input id="note" maxlength="160" autocomplete="off"></label><button>Hinweis senden</button></form></section></div></main></body></html>
